$kind: http-request
description: ""
url: "{{baseUrl}}/listings"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "title": "string",
      "description": "string",
      "city": "string",
      "price": 9737.117943641308
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string"
        },
        "description": {
          "type": "string"
        },
        "city": {
          "type": "string"
        },
        "price": {
          "type": "number"
        }
      }
    }
scripts:
  - type: afterResponse
    code: "let response = pm.response.json();\r

      \r

      pm.test(\"have valid response object\", function () {\r

      \    pm.expect(response).to.ownProperty(\"id\");\r

      })\r

      \r

      pm.test(\"have valid status code\", function () {\r

      \    pm.expect(pm.response.code).to.equal(201);\r

      })\r

      \r

      if (pm.response.to.be.success) {\r

      \    pm.collectionVariables.set(\"productId\", response.id);\r

      }\r

      \r\n"
    language: text/javascript
examples: ./.resources/Create Listings.resources/examples
order: 3000
