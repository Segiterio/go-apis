$kind: http-request
description: ""
url: "{{baseUrl}}/listings/:id"
method: DELETE
pathVariables:
  - key: id
    value: "{{productId}}"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
scripts:
  - type: beforeRequest
    code: "pm.test(\"Product should not empty\", function() {\r

      \     let productId = pm.request.url.variables.get(\"id\");\r

      \     pm.expect(productId).to.not.undefined;\r

      })"
    language: text/javascript
examples: ./.resources/Delete Listings.resources/examples
order: 5000
