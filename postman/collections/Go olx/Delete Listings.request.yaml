$kind: http-request
url: "{{BASE_URL}}/listings/:id"
method: DELETE
pathVariables:
  - key: id
    value: "{{productId}}"
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
scripts:
  - type: beforeRequest
    code: "pm.test(\"Product should not empty\", function() {\r

      \     let productId = pm.request.url.variables.get(\"id\");\r

      \     pm.expect(productId).to.not.undefined;\r

      })"
    language: text/javascript
order: 5000
